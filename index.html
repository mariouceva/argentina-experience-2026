<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Argentina Experience 2026</title>
<meta name="theme-color" content="#0B2545">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Argentina 2026">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
:root{padding-top:env(safe-area-inset-top,0px);color-scheme:light}[hidden]{display:none!important}img{max-width:100%}
/* Layout: sidebar editorial en escritorio, barra inferior de 5 apartados en móvil. Un solo acento (terracota) sobre azul profundo, arena y oro. */
:root{
  --bg:#F2ECE0; --surface:#FBF8F2; --surface2:#E9E1D1; --fg:#0E1E36; --muted:#5B6678; --line:#D8CEBB;
  --navy:#0B2545; --navy2:#13335E; --terra:#B4532F; --terra-fg:#FFFFFF; --gold:#A97F2E; --goldsoft:#E4CD9A;
  --ok:#2E7D4F; --warn:#B7791F; --bad:#B3392F; --okbg:#DDEEDF; --warnbg:#F6E7C6; --badbg:#F4D9D4;
  --d1:#B4532F; --d2:#0B5C8A; --d3:#2E7D4F; --d4:#8A4F9E; --d5:#1B8A8A; --d6:#B7791F;
  --f-disp:'Fraunces',Georgia,'Times New Roman',serif; --f-body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --nav-h:64px; --side-w:248px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1527; --surface:#112340; --surface2:#17305A; --fg:#EEE8DA; --muted:#A3AEC2; --line:#27406B;
  --navy:#0A1B33; --navy2:#17305A; --terra:#E0825E; --terra-fg:#1A0E08; --gold:#D8B46A; --goldsoft:#5B4A24;
  --ok:#6FCB8E; --warn:#E4B35A; --bad:#EF8A7E; --okbg:#173B2A; --warnbg:#3F3216; --badbg:#4A211C;
  --d1:#E0825E; --d2:#58B4E6; --d3:#6FCB8E; --d4:#C08AD6; --d5:#5FD0D0; --d6:#E4B35A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1527; --surface:#112340; --surface2:#17305A; --fg:#EEE8DA; --muted:#A3AEC2; --line:#27406B;
  --navy:#0A1B33; --navy2:#17305A; --terra:#E0825E; --terra-fg:#1A0E08; --gold:#D8B46A; --goldsoft:#5B4A24;
  --ok:#6FCB8E; --warn:#E4B35A; --bad:#EF8A7E; --okbg:#173B2A; --warnbg:#3F3216; --badbg:#4A211C;
  --d1:#E0825E; --d2:#58B4E6; --d3:#6FCB8E; --d4:#C08AD6; --d5:#5FD0D0; --d6:#E4B35A; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:auto}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;margin:0;
  padding-left:0;padding-right:0}
h1,h2,h3{font-family:var(--f-disp);font-weight:600;line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:1.5rem} h3{font-size:1.15rem} p{margin:0}
a{color:var(--terra)} button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}
.tnum,.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)} .small{font-size:.85rem}

/* shell */
.shell{display:block;min-height:100vh}
.side{display:none}
main{padding-block:16px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  max-width:1080px;margin-inline:auto;display:flex;flex-direction:column;gap:20px;min-width:0}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--navy);color:#F2ECE0;display:grid;grid-template-columns:repeat(5,1fr);
  padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));border-top:2px solid var(--gold)}
.bottom a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;text-decoration:none;color:#BFC8D8;font-size:.7rem;font-weight:500;border-radius:10px;min-height:48px}
.bottom a[aria-current="page"]{color:#fff;background:rgba(255,255,255,.1)}
.bottom svg,.side svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
@media (min-width:900px){
  .shell{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr)}
  .side{display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;background:var(--navy);color:#F2ECE0;padding:28px 18px;border-right:3px solid var(--gold)}
  .side .brand{font-family:var(--f-disp);font-size:1.35rem;line-height:1.1;margin-bottom:2px}
  .side .brand small{display:block;font-family:var(--f-body);font-size:.68rem;letter-spacing:.16em;color:var(--goldsoft);margin-top:6px;text-transform:uppercase}
  .side nav{display:flex;flex-direction:column;gap:4px;margin-top:22px}
  .side nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;color:#CBD3E1;text-decoration:none;font-weight:500}
  .side nav a[aria-current="page"]{background:rgba(255,255,255,.12);color:#fff}
  .side .foot{margin-top:auto;font-size:.78rem;color:#9DA9BF}
  .bottom{display:none}
  main{padding-block:32px 48px;padding-left:32px;padding-right:32px}
}

/* components */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.flat{border:0;background:transparent;padding:0}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;text-decoration:none;color:var(--fg);font-weight:600;font-size:.9rem}
.btn:hover{border-color:var(--gold)}
.btn.pri{background:var(--terra);border-color:var(--terra);color:var(--terra-fg)}
.btn.navy{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.sm{min-height:36px;padding:5px 11px;font-size:.82rem}
.btn.danger{color:var(--bad)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font-size:.74rem;font-weight:700;background:var(--surface2);color:var(--fg);white-space:nowrap}
.chip.ok{background:var(--okbg);color:var(--ok)} .chip.warn{background:var(--warnbg);color:var(--warn)} .chip.bad{background:var(--badbg);color:var(--bad)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.tabs button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 14px;min-height:40px;cursor:pointer;font-weight:600;font-size:.85rem}
.tabs button[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.alert{display:flex;gap:10px;padding:11px 13px;border-radius:12px;background:var(--warnbg);color:var(--fg);border-left:4px solid var(--warn);font-size:.9rem}
.alert.bad{background:var(--badbg);border-color:var(--bad)} .alert.ok{background:var(--okbg);border-color:var(--ok)}
.alert b{display:block}
.pending{color:var(--warn);font-weight:600}

/* forms */
.f{display:flex;flex-direction:column;gap:4px;font-size:.82rem;font-weight:600;min-width:0}
.f span{color:var(--muted)}
input,select,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 11px;min-height:42px;width:100%;min-width:0}
textarea{min-height:84px;resize:vertical}
input[type=checkbox],input[type=radio]{width:20px;height:20px;min-height:0;accent-color:var(--terra)}
.form{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr))}
.form .full{grid-column:1/-1}
.checks{display:flex;flex-wrap:wrap;gap:8px 14px}
.checks label{display:flex;gap:6px;align-items:center;font-weight:500;font-size:.88rem}
.err{color:var(--bad);font-size:.82rem;font-weight:600}

/* hero */
.hero{border-radius:18px;overflow:hidden;background:var(--navy);color:#F7F1E4;position:relative;isolation:isolate}
.hero svg.sky{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.hero .in{padding:22px 18px 18px;display:flex;flex-direction:column;gap:14px}
.hero h1{font-family:var(--f-disp);font-size:clamp(1.9rem,6.5vw,3.2rem);line-height:1.02;font-weight:700;letter-spacing:-.02em}
.hero .sub{color:#DCD3BE;max-width:34rem}
.hero .dates{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.count{display:flex;gap:10px}
.count div{background:rgba(7,18,36,.62);border:1px solid rgba(228,205,154,.5);border-radius:12px;padding:8px 12px;text-align:center;min-width:64px}
.count b{display:block;font-family:var(--f-disp);font-size:1.7rem;line-height:1}
.count span{font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--goldsoft)}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (min-width:640px){.quick{grid-template-columns:repeat(6,1fr)}}
.quick a,.quick button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:12px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--fg);font-size:.78rem;font-weight:600;cursor:pointer;text-align:center;min-height:76px}
.quick svg{width:24px;height:24px;fill:none;stroke:var(--terra);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.quick .sos{background:var(--bad);color:#fff;border-color:var(--bad)} .quick .sos svg{stroke:#fff}
.ring{width:84px;height:84px;flex:none}
.dayrow{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line);text-decoration:none;color:inherit}
.dayrow:first-child{border-top:0}
.dot{width:12px;height:12px;border-radius:50%;flex:none;margin-top:6px}
.dnum{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;flex:none;font-family:var(--f-disp)}

/* itinerary */
.daychips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.daychips button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;cursor:pointer;text-align:left;min-width:92px}
.daychips button b{display:block;font-family:var(--f-disp);font-size:1.05rem}
.daychips button[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.item{display:grid;grid-template-columns:36px minmax(0,1fr);gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item.done .nm{text-decoration:line-through;color:var(--muted)}
.leg{font-size:.8rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}
.ph{aspect-ratio:16/9;max-width:100%;border-radius:12px;background:var(--surface2);display:grid;place-items:center;overflow:hidden;position:relative}
.ph img{width:100%;height:100%;object-fit:cover}
.ph svg{width:100%;height:100%}
.kv{display:grid;grid-template-columns:minmax(88px,34%) minmax(0,1fr);gap:6px 12px;font-size:.9rem}
.kv dt{color:var(--muted);font-weight:600} .kv dd{margin:0;overflow-wrap:anywhere}

/* map */
.mapbox{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface2)}
.mapbox svg{display:block;width:100%;height:auto;max-height:70vh}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.82rem}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:5px;vertical-align:-1px}

/* tables & charts */
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
td.r,th.r{text-align:right}
.bar{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--terra);border-radius:99px}
.bar.over i{background:var(--bad)}

/* modal */
#modal{position:fixed;inset:0;z-index:50;display:none}
#modal.open{display:block}
.scrim{position:absolute;inset:0;background:rgba(5,12,24,.62)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:18px max(16px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:900px){.sheet{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:min(720px,92vw);max-height:88vh;border-radius:18px}}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 20px + env(safe-area-inset-bottom,0px));background:var(--navy);color:#fff;padding:10px 16px;border-radius:99px;font-size:.88rem;z-index:60;display:none;max-width:90vw}
@media (min-width:900px){#toast{bottom:24px}}
.lock{min-height:100vh;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px));background:var(--navy);color:#F7F1E4}
.lock .card{background:var(--surface);color:var(--fg);max-width:380px;width:100%}
.banner{display:none;background:var(--warnbg);color:var(--fg);padding:8px 16px;font-size:.85rem;text-align:center}
.banner.show{display:block}
@media (prefers-reduced-motion:no-preference){.btn,.bottom a,.daychips button{transition:background .15s,border-color .15s}}

</style>
</head>

const DB = {
  db: null, mem: {kv: {}, files: {}}, persistent: false,
  async open() {
    try {
      if (!window.indexedDB) throw 0;
      this.db = await new Promise((ok, no) => {
        const r = indexedDB.open('argexp2026', 1);
        r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('kv'); d.createObjectStore('files'); };
        r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); r.onblocked = () => no(0);
      });
      this.persistent = true;
    } catch (e) { this.db = null; this.persistent = false; }
  },
  req(store, mode, fn) {
    return new Promise((ok, no) => {
      try {
        const t = this.db.transaction(store, mode); const rq = fn(t.objectStore(store));
        t.oncomplete = () => ok(rq ? rq.result : undefined); t.onerror = () => no(t.error); t.onabort = () => no(t.error);
      } catch (e) { no(e); }
    });
  },
  async get(store, key) { if (!this.db) return this.mem[store][key]; try { return await this.req(store, 'readonly', s => s.get(key)); } catch (e) { return this.mem[store][key]; } },
  async put(store, key, val) { if (!this.db) { this.mem[store][key] = val; return; } try { await this.req(store, 'readwrite', s => s.put(val, key)); } catch (e) { this.mem[store][key] = val; } },
  async del(store, key) { delete this.mem[store][key]; if (this.db) { try { await this.req(store, 'readwrite', s => s.delete(key)); } catch (e) {} } }
};

/* ---- seguridad local: PIN con hash (protege el acceso casual a la app en este dispositivo) ---- */
async function sha(txt) {
  try {
    const h = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt));
    return Array.from(new Uint8Array(h)).map(x => x.toString(16).padStart(2, '0')).join('');
  } catch (e) { let h = 5381; for (const c of txt) h = ((h << 5) + h + c.charCodeAt(0)) | 0; return 'd' + (h >>> 0).toString(16); }
}

const today0 = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };

function money(n, cur) {
  cur = cur || 'COP'; if (n == null || isNaN(n)) return '—';
  try { return new Intl.NumberFormat('es-CO', {style: 'currency', currency: cur, maximumFractionDigits: cur === 'USD' ? 2 : 0}).format(n); }
  catch (e) { return cur + ' ' + Math.round(n); }

function toCOP(amount, cur) {
  if (cur === 'COP') return amount;
  const r = S.rates && S.rates.r && S.rates.r[cur]; return r ? amount / r : null;
}
function km(a, b) {
  const R = 6371, t = x => x * Math.PI / 180, dLa = t(b.lat - a.lat), dLo = t(b.lng - a.lng);
  const h = Math.sin(dLa / 2) ** 2 + Math.cos(t(a.lat)) * Math.cos(t(b.lat)) * Math.sin(dLo / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
const STREET = 1.3;
const walkMin = k => Math.max(1, Math.round(k * STREET * 12));
const carMin = k => Math.max(4, Math.round(k * STREET * 60 / 22));
const transitMin = k => k < 0.7 ? walkMin(k) : Math.round(k * STREET * 60 / 14 + 8);
const fm = m => m >= 60 ? Math.floor(m / 60) + ' h ' + String(m % 60).padStart(2, '0') + ' min' : m + ' min';
const hhmm = m => String(Math.floor(m / 60) % 24).padStart(2, '0') + ':' + String(Math.round(m) % 60).padStart(2, '0');
const toMin = t => { const a = (t || '').split(':'); return a.length === 2 && !isNaN(a[0]) ? (+a[0]) * 60 + (+a[1]) : null; };

function niceKm(x) { const c = [0.1, 0.2, 0.5, 1, 2, 5, 10, 20, 50, 100, 200]; for (const v of c) if (v >= x) return v; return 500; }
function mapSVG(groups, opts) {

  let mnLo = Math.min(...pts.map(c => c.lng)), mxLo = Math.max(...pts.map(c => c.lng));
  if (mxLa - mnLa < 0.004) { mnLa -= 0.003; mxLa += 0.003; }

  s += '</svg>';
  return '<div class="mapbox">' + s + '</div>';
}

function schedule(list) {
  let prev = null, dep = null; const out = [];
  list.forEach(p => {
    const c = C(p); let leg = null, arr = null;
    if (prev && c) { const k = km(prev, c); leg = {k, w: walkMin(k), t: transitMin(k), c: carMin(k)}; }
    const fixed = toMin(p.time);
    if (fixed != null) arr = fixed; else if (dep != null) arr = dep + (leg ? (leg.k < 1.5 ? leg.w : leg.t) : 10);
    dep = arr != null ? arr + (+p.mins || 0) : null;
    if (c) prev = c;
    out.push({p, leg, arr});
  });
  return out;
}
function optimizeOrder(list) {
  const idx = []; list.forEach((p, i) => { if (C(p)) idx.push(i); });
  if (idx.length < 3) return list.slice();
  const items = idx.map(i => list[i]), res = [items[0]], rest = items.slice(1);
  while (rest.length) {
    const last = C(res[res.length - 1]); let bi = 0, bd = 1e9;
    rest.forEach((p, i) => { const d = km(last, C(p)); if (d < bd) { bd = d; bi = i; } });
    res.push(rest.splice(bi, 1)[0]);
  }
  const out = list.slice(); idx.forEach((i, j) => out[i] = res[j]); return out;
}

function expStats() {
  const tr = {}; S.travelers.forEach(t => tr[t.id] = {name: t.name, paid: 0, owed: 0});
  const cat = {}, day = {}; let total = 0, nor = 0;
  S.expenses.forEach(e => {
    const v = toCOP(+e.amount, e.cur); if (v == null) { nor++; return; }
    total += v; cat[e.cat] = (cat[e.cat] || 0) + v; day[e.date] = (day[e.date] || 0) + v;
    if (tr[e.payer]) tr[e.payer].paid += v; const sp = (e.split || []).filter(x => tr[x]); sp.forEach(x => tr[x].owed += v / sp.length);
  });
  return {tr, cat, day, total, nor};
}
function settle(tr) {
  const b = Object.values(tr).map(x => ({n: x.name, v: x.paid - x.owed})), out = [];
  const pos = b.filter(x => x.v > 1).sort((a, c) => c.v - a.v), neg = b.filter(x => x.v < -1).sort((a, c) => a.v - c.v);
  let i = 0, j = 0; while (i < neg.length && j < pos.length) { const m = Math.min(-neg[i].v, pos[j].v); out.push(neg[i].n + ' paga ' + money(m) + ' a ' + pos[j].n); neg[i].v += m; pos[j].v -= m; if (neg[i].v > -1) i++; if (pos[j].v < 1) j++; }
  return out;
}

    const name = val(f, 'name'); if (!name) return setErr('bkerr', 'Escribe el nombre del servicio.');
    let fileId = null; try { fileId = await putFile(f.elements.file.files[0]); } catch (e) { return setErr('bkerr', e.message); }
    S.bookings.push({id: uid('b'), name, cat: val(f, 'cat'), status: val(f, 'status'), date: val(f, 'date'), time: val(f, 'time'), code: val(f, 'code'), addr: val(f, 'addr'), fileId});
    save(); render(); toast('Reserva guardada.');
  },
  async doc(f) {
    const name = val(f, 'name'); if (!name) return setErr('dcerr', 'Escribe el nombre o titular.');
    let fileId = null; try { fileId = await putFile(f.elements.file.files[0]); } catch (e) { return setErr('dcerr', e.message); }
    S.docs.push({id: uid('d'), name, type: val(f, 'type'), fileId}); save(); render(); toast('Documento guardado en este dispositivo.');
  },
  contact(f) { S.contacts.push({id: uid('t'), name: val(f, 'name'), phone: val(f, 'phone')}); save(); render(); },
  flight(f) {
    if (!val(f, 'from') || !val(f, 'to')) return setErr('flerr', 'Indica origen y destino.');
    S.flights.push({id: uid('v'), type: val(f, 'type'), no: val(f, 'no'), from: val(f, 'from'), to: val(f, 'to'), date: val(f, 'date'), time: val(f, 'time'), term: val(f, 'term'), code: val(f, 'code'), bags: val(f, 'bags')});
    save(); render(); toast('Vuelo guardado.');
  },
  traveler(f) { S.travelers.push({id: uid('u'), name: val(f, 'name'), nat: val(f, 'nat')}); save(); render(); toast('Viajero agregado.'); },
  budget(f) { CATS.forEach((c, i) => S.budgets[c] = parseFloat(val(f, 'b' + i)) || 0); save(); render(); toast('Presupuestos guardados.'); },
  trip(f) { if (val(f, 'end') < val(f, 'start')) { toast('La fecha final no puede ser anterior al inicio.'); return; } S.trip = {name: val(f, 'name'), start: val(f, 'start'), end: val(f, 'end')}; save(); render(); toast('Datos guardados.'); },
  chk(f) { const g = val(f, 'g'); S.checklist[g].push({id: uid('c'), text: val(f, 'text'), done: false}); save(); render(); },
  uy(f) {
    const u = S.uy, pk = val(f, 'port'), dk = val(f, 'dest'), po = URY_PORTS.find(x => x.k === pk), de = URY_DESTS.find(x => x.k === dk);
    u.portK = pk; u.port = po ? {lat: po.lat, lng: po.lng} : null; u.destK = dk; u.dest = de ? {lat: de.lat, lng: de.lng} : null; u.destName = de ? de.n : '';
    u.arrive = val(f, 'arrive'); u.company = val(f, 'company'); u.out = val(f, 'out'); u.back = val(f, 'back'); u.res = val(f, 'res'); u.notes = val(f, 'notes');
    const d3 = S.places; if (d3.p302) d3.p302.time = u.out; if (d3.p306) d3.p306.time = u.back;
    save(); render(); toast('Datos de Uruguay guardados.');
  },
  uysight(f) { S.uy.sights.push({name: val(f, 'name'), time: val(f, 'time'), cost: val(f, 'cost')}); save(); render(); },
  async diary(f) {
    const text = val(f, 'text'); if (!text && !f.elements.file.files[0]) return setErr('drerr', 'Escribe algo o agrega una foto.');
    let photoId = null; try { photoId = await putFile(f.elements.file.files[0]); } catch (e) { return setErr('drerr', e.message); }
    S.diary.push({id: uid('r'), date: val(f, 'date'), text, photoId}); save(); render(); toast('Recuerdo guardado.');
  },
  async photo(f) {
    const p = S.places[f.dataset.id], file = f.elements.file.files[0]; if (!file) { toast('Elige una imagen primero.'); return; }
    try { const id = await putFile(file); removeFiles([p.photoId]); p.photoId = id; save(); render(); } catch (e) { toast(e.message); }
  },
  place(f) {
    const id = f.dataset.id, name = val(f, 'name'); if (!name) { toast('Escribe un nombre.'); return; }
    const lat = parseFloat(val(f, 'lat').replace(',', '.')), lng = parseFloat(val(f, 'lng').replace(',', '.'));
    if ((val(f, 'lat') || val(f, 'lng')) && (isNaN(lat) || isNaN(lng) || Math.abs(lat) > 90 || Math.abs(lng) > 180)) { toast('Latitud y longitud no son válidas.'); return; }
    const data = {name, day: +val(f, 'day'), time: val(f, 'time'), mins: parseInt(val(f, 'mins'), 10) || 0, addr: val(f, 'addr'), hours: val(f, 'hours'), price: val(f, 'price'), url: val(f, 'url'), needs: val(f, 'needs'), outdoor: val(f, 'outdoor') === '1', desc: val(f, 'desc'), see: val(f, 'see'), tips: val(f, 'tips'), alert: val(f, 'alert')};
    if (data.url && !/^https?:\/\//i.test(data.url)) { toast('La URL debe empezar por http:// o https://'); return; }
    if (!isNaN(lat) && !isNaN(lng)) { data.lat = lat; data.lng = lng; }
    if (id === 'new') {
      const nid = uid('p'); S.places[nid] = MIN(nid, data.day, name, data.lat == null ? null : data.lat, data.lng == null ? null : data.lng, data.addr, data.desc, data.see, data.mins, '—', data.tips, data); dayOf(data.day).items.push(nid);
    } else {
      const p = S.places[id], old = p.day; Object.assign(p, data);
      if (old !== data.day) { dayOf(old).items = dayOf(old).items.filter(x => x !== id); dayOf(data.day).items.push(id); }
    }
    ui.modal = null; save(); render(); toast('Cambios guardados.');
  },
  async pin(f) {
    const p = val(f, 'pin'); if (!/^\d{4,8}$/.test(p)) return setErr('pnerr', 'El PIN debe tener de 4 a 8 dígitos.');
    const salt = uid('s'); S.pin = {salt, hash: await sha(salt + p)}; ui.unlocked = true; save(); render(); toast('PIN activado.');
  },
  async unlock(f) {
    const p = val(f, 'pin'), h = await sha(S.pin.salt + p);
    if (h === S.pin.hash) { ui.unlocked = true; $('#app').innerHTML = ''; render(); } else setErr('ulerr', 'PIN incorrecto.');
  },
  import(f) {
    try {
      const o = JSON.parse(val(f, 'text')); if (!o || !o.days || !o.places) throw new Error('x');
      S = Object.assign(SEED(), o); save(); render(); toast('Copia importada.');
    } catch (e) { setErr('imerr', 'El texto no es una copia válida de la app.'); }
  }
};

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t || !ACT[t.dataset.act]) return;
  if (t.tagName === 'BUTTON' || t.tagName === 'g' || t.classList.contains('scrim')) e.preventDefault();
  ACT[t.dataset.act](t, e);
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.tagName === 'g' && e.target.dataset.act) { e.preventDefault(); ACT[e.target.dataset.act](e.target, e); }
  if (e.key === 'Escape' && ui.modal) ACT.close();
});
document.addEventListener('change', e => { const t = e.target.closest('[data-chg]'); if (t && CHG[t.dataset.chg]) CHG[t.dataset.chg](t); });
document.addEventListener('input', e => { if (e.target.dataset && e.target.dataset.input === 'search') { ui.q = e.target.value; const r = $('#sr'); if (r) r.innerHTML = searchHTML(ui.q); } });
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]'); if (!f) return; e.preventDefault();
  const fn = FORMS[f.dataset.form]; if (fn) Promise.resolve(fn(f)).catch(() => toast('No se pudo guardar. Intenta de nuevo.'));
});
window.addEventListener('hashchange', () => { ui.modal = null; render(); window.scrollTo(0, 0); });
window.addEventListener('online', () => { updOnline(); if (S && !S.rates) loadRates().catch(() => {}); });
window.addEventListener('offline', updOnline);

(async function boot() {
  await loadState();
  if (!location.hash) { try { history.replaceState(null, '', '#inicio'); } catch (e) {} }
  render();
  setInterval(() => { const c = $('#cd'); if (c && S) c.innerHTML = cdHTML(); }, 30000);
  if (navigator.onLine) { if (!S.weather || Date.now() - S.weather.ts > 6 * 36e5) loadWeather().then(() => { if (route() === 'inicio' || (route() === 'mi-viaje' && ui.tab === 'clima')) render(); }).catch(() => {}); if (!S.rates || Date.now() - S.rates.ts > 24 * 36e5) loadRates().catch(() => {}); }
  if (window.__STANDALONE && 'serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();

</script>
</body>
</html>
